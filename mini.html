<!Doctype html>
<html>
<head>
  <button class="Subscribe-button">SUBSCRIBE </button>
<button class="join-button">JOIN </button>
<button class="tweet-button">TWEET</button>

</head>
<body>

  <style>
  
  .subscribe-button{
    background-color: rgb(206, 34, 34);
    color: white;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 16px;
    padding-right: 16px;
    vertical-align: top;
    
    border-radius: 2PX;
    cursor: pointer;
    margin-right: 8px;

  }
  .join-button{
    background-color:white;
    color: rgb(72, 72, 177);
    border-color: rgb(88, 88, 203);
    border-style: solid;
    border-width: 1px;
    padding-left: 25px;
    padding-right:25px ;
    padding-top:20px ;
    padding-top: 9px;
    padding-bottom: 9px;
    padding-left: 16px;
    padding-right: 16px;
    vertical-align: top;
    
     
    border-radius: 2px;
    cursor: pointer;
  }
  .subscribe-button:hover{
    opacity: 0.8;
  }
  .subscribe-button:active{
    opacity: 0.5;
  }
  .join-button:hover{
    background-color:aqua;
    color: white;
  }
  .join-button:active{
    opacity:0.7;
  }
  .tweet-button{
    background-color:aqua;
    color: white;
    border: none;
    height: 36px;
    width: 74px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition:box-shadow 0.15s;
    vertical-align: top;
   
  }
  .tweet-button:hover{
    box-shadow:5px 5px 10px rgba(0, 0, 0,0.15)

  }

    
    
    

  
    

  
</style>
</body>
</html>
