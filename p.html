<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BlueSky – Elevate Your Business</title>
    <!-- Google Fonts for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8faff;
            color: #1a6bea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            line-height: 1.5;
        }

        /* ---------- Card / Container ---------- */
        .card {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 20, 50, 0.10);
            padding: 56px 48px 40px;
            transition: all 0.2s ease;
        }

        /* ---------- Hero Section ---------- */
        .hero {
            text-align: center;
            margin-bottom: 56px;
        }

        .hero .badge {
            display: inline-block;
            background: #eef4ff;
            color: #2a5bff;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 6px 18px;
            border-radius: 40px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 12px;
            background: linear-gradient(145deg, #0b1a3a, #2a5bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: #1a6bea;
            font-weight: 400;
            max-width: 540px;
            margin: 0 auto 32px;
        }

        /* ---------- CTA Button ---------- */
        .btn-primary {
            display: inline-block;
            background: #1a6bea;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 16px 48px;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(26, 42, 94, 0.25);
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: #2a5bff;
            transform: translateY(-3px);
            box-shadow: 0 14px 34px #1a6bea(42, 91, 255, 0.35);
        }

        .btn-primary i {
            margin-left: 10px;
            font-size: 0.9rem;
        }

        /* ---------- Features Grid ---------- */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin: 64px 0 56px;
        }

        .feature-item {
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 22px 26px;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .feature-item:hover {
            background: #ffffff;
            border-color: #1a6bea;
            box-shadow: 0 10px 30px rgba(0, 20, 50, 0.06);
            transform: translateY(-4px);
        }
.feature-item .icon {
            font-size: 2.2rem;
            color: #2a5bff;
            margin-bottom: 14px;
            display: inline-block;
            background: #e6edff;
            width: 64px;
            height: 64px;
            line-height: 64px;
            border-radius: 20px;
        }

        .feature-item h3 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #1a6bea;
            margin-bottom: 6px;
        }

        .feature-item p {
            font-size: 0.9rem;
            color: #1a6bea;
            font-weight: 400;
            max-width: 180px;
            margin: 0 auto;
        }

        /* ---------- Testimonial ---------- */
        .testimonial {
            background: #1a6bea;
            border-radius: 28px;
            padding: 36px 40px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 48px;
        }

        .testimonial blockquote {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8faff;
            letter-spacing: -0.01em;
            flex: 1 1 260px;
        }

        .testimonial blockquote i {
            color: #2a5bff;
            font-size: 1.1rem;
            margin-right: 8px;
        }

        .testimonial .cite {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .testimonial .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a5bff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .testimonial .name {
            font-weight: 700;
            color: #0b1a3a;
            font-size: 1rem;
        }

        .testimonial .title {
            font-size: 0.85rem;
            color: #1a6bea;
        }

        /* ---------- Footer ---------- */
        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-top: 24px;
            border-top: 1px solid #e9edf4;
            font-size: 0.9rem;
            color: #1a6bea;
        }

        .footer .brand {
            font-weight: 600;
            color: #1a6bea;
            letter-spacing: -0.3px;
        }

        .footer .brand i {
            color: #2a5bff;
            margin-right: 6px;
        }

        .footer .policy {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .footer .policy a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }

        .footer .policy a:hover {
            color: #fff;
        }

        .footer .copy {
            font-weight: 400;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            .card {
                padding: 36px 24px 28px;
                border-radius: 28px;
            }

            .features {
                grid-template-columns: 1fr 1fr;
                gap: 18px;
                margin: 40px 0 36px;
            }

            .feature-item {
                padding: 22px 16px 20px;
            }

            .testimonial {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
                padding: 28px 24px;
            }

            .testimonial blockquote {
                font-size: 1.1rem;
            }

            .footer {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
.footer .policy {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px 20px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .btn-primary {
                padding: 14px 32px;
                font-size: 1rem;
                width: 100%;
            }

            .testimonial blockquote {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== HERO ===== -->
        <div class="hero">

            <h1>ELEVATE YOUR BUSINESS TODAY.</h1>

            <a href="#" class="btn-primary">

        <!-- ===== FEATURES ===== -->
        <div class="features">
            <div class="feature-item">

                <h3>MODERN DESIGN</h3>
                
            </div>
            <div class="feature-item">

                <h3>USER FOCUSED</h3>
                
            </div>
            <div class="feature-item">
                <div class="icon"><i class="fas fa-chart-line"></i></div>

            </div>
        </div>

        
        <div class="testimonial">
            <blockquote>
                <i class="fas fa-quote-left"></i> AMAZING SERVICE! Highly recommended.
            </blockquote>
            <div class="cite">
                <div class="avatar">JD</div>
                <div>
                    <div class="name">Jane Doe</div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <div class="brand">
                <i class="fas fa-cloud-sun"></i> BlueSky
            </div>
            <div class="policy">
                <span class="copy">© 2023, All Rights Reserved.</span>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">BlueSky Policy</a>
            </div>
        </div>

    </div>

</body>
</html>
